# Bouwt de editor, verpakt hem als VS Code-extensie (.vsix) en IntelliJ-plugin (.zip)
# en publiceert beide bij een tag (bv. v1.2.0) in de GitLab Package Registry.

stages:
  - build
  - package
  - publish

variables:
  NODE_IMAGE: node:20
  JDK_IMAGE: eclipse-temurin:21-jdk
  # Versie op een tag: "v1.2.0" -> "1.2.0". Zonder tag: een testversie.
  VERSION: 0.0.0-$CI_COMMIT_SHORT_SHA

build:webview:
  stage: build
  image: $NODE_IMAGE
  script:
    - npm ci
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

package:vscode:
  stage: package
  image: $NODE_IMAGE
  needs: [build:webview]
  script:
    - if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; fi
    - cp -R dist packages/vscode/webview
    - cd packages/vscode
    - npm ci
    - npm version "$VERSION" --no-git-tag-version
    - npm run package
  artifacts:
    paths:
      - packages/vscode/*.vsix

package:intellij:
  stage: package
  image: $JDK_IMAGE
  needs: [build:webview]
  script:
    - if [ -n "$CI_COMMIT_TAG" ]; then VERSION="${CI_COMMIT_TAG#v}"; fi
    - cd packages/intellij
    - ./gradlew buildPlugin -PpluginVersion="$VERSION"
  artifacts:
    paths:
      - packages/intellij/build/distributions/*.zip

publish:packages:
  stage: publish
  image: curlimages/curl:latest
  needs: [package:vscode, package:intellij]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mmd-flowchart/$VERSION"
    - |
      for FILE in packages/vscode/*.vsix packages/intellij/build/distributions/*.zip; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$FILE" "$URL/$(basename "$FILE")"
      done
