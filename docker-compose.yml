services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmd-flowchart:latest
    container_name: mmd-flowchart
    # ports:
    #   - "8080:8080"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mmd-flowchart.rule=Host(`mmd-flowchart.custom-tools.dictuy.iesprd.ictu-sr.nl`)"
      - "traefik.http.routers.mmd-flowchart.entrypoints=websecure"
      - "traefik.http.routers.mmd-flowchart.tls=true"
      - "traefik.http.routers.mmd-flowchart.service=mmd-flowchart"
      - "traefik.http.services.mmd-flowchart.loadbalancer.server.port=8080"
      - "traefik.docker.network=dictuy-network"
    networks:
      - dictuy-network

networks:
  dictuy-network:
    external: true